<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RouteCraft • Route lab</title>
<style>body{margin:0;background:#101726;color:#edf3ff;font:16px system-ui}main{max-width:1050px;margin:50px auto;padding:24px}h1{font-size:48px;margin:10px 0}p{color:#acbcd3}button{padding:12px 20px;background:#a5f2ca;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin:0 8px 16px 0}canvas{display:block;width:100%;background:#182338;border:1px solid #34425a;border-radius:18px;touch-action:none}output{display:block;padding:20px 0;font-size:20px}small{color:#acbcd3}</style>
<main><small>ALGORITHM LAB / 01</small><h1>Every stop. Less distance.</h1><p>Click to add stops. The first point is the depot. Compare nearest neighbour with 2-opt improvement.</p><button id="solve">Optimise route</button><button id="reset">Clear stops</button><button id="sample">Load demo</button><canvas width="1000" height="500" aria-label="Interactive route diagram"></canvas><output aria-live="polite">Add at least two stops.</output><small>Illustrative straight-line distance, not road navigation. Maximum 100 stops. No location data leaves this local server.</small></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),out=document.querySelector('output');let points=[],route=[],version=0;
function draw(){ctx.clearRect(0,0,1000,500);ctx.strokeStyle='#24324a';for(let x=0;x<1000;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<500;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}if(route.length){ctx.beginPath();route.concat(route[0]).forEach((n,i)=>{const p=points[n];i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.strokeStyle='#a5f2ca';ctx.lineWidth=3;ctx.stroke();ctx.lineWidth=1}points.forEach((p,i)=>{ctx.beginPath();ctx.arc(...p,i?7:10,0,Math.PI*2);ctx.fillStyle=i?'#8aafff':'#a5f2ca';ctx.fill();ctx.fillStyle='#fff';ctx.fillText(i?'Stop '+i:'Depot',p[0]+13,p[1]-10)})}
canvas.onclick=e=>{if(points.length>=100)return;const r=canvas.getBoundingClientRect();points.push([(e.clientX-r.left)*1000/r.width,(e.clientY-r.top)*500/r.height]);route=[];version++;out.textContent=points.length+' stops ready';draw()};
document.querySelector('#reset').onclick=()=>{points=[];route=[];version++;out.textContent='Add at least two stops.';draw()};
document.querySelector('#sample').onclick=()=>{points=[[90,250],[820,90],[210,70],[700,380],[450,230],[120,420],[890,450],[400,70],[610,140],[290,370]];route=[];version++;out.textContent='10 stops ready';draw()};
document.querySelector('#solve').onclick=async()=>{if(points.length<2)return;const v=version;out.textContent='Optimising…';try{const response=await fetch('/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({points})});const data=await response.json();if(v!==version)return;if(!response.ok)throw Error(data.error);route=data.route;out.textContent=`${data.optimised_length.toFixed(0)} units • ${data.saved_percent}% shorter than nearest neighbour • ${points.length} stops`;draw()}catch(e){if(v===version)out.textContent='Could not optimise: '+e.message}};draw();
</script></html>
